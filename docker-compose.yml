services:
  dotnet:
    build:
      context: ./api
      dockerfile: ./JassSpace.Api/Dockerfile
    ports:
      - "5001:8080"
    env_file:
      - .env
    environment:
      - ApplyMigrationsOnStartup=${APPLY_MIGRATIONS:-false}
    volumes:
      - dotnet-media-cache:/app/cache
    restart: unless-stopped
    cpus: "0.55"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 160
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextjs:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://dotnet:8080
      - NODE_OPTIONS=--max-old-space-size=256
    restart: unless-stopped
    cpus: "0.35"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 120
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dotnet-media-cache:
