name: Deploy NextJS Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy-nextjs.yml"

permissions:
  contents: read

concurrency:
  group: jassspace-production-deploy
  cancel-in-progress: false

jobs:
  validate-nextjs:
    name: Validate NextJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-nextjs:
    name: Deploy NextJS
    needs: validate-nextjs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${REMOTE_DIR:?Missing REMOTE_DIR secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          echo "Deployment secrets are present."

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy nextjs service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SERVICE_NAME: nextjs
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" "$SERVICE_NAME" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          SERVICE_NAME="$2"
          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          echo "[$SERVICE_NAME] Waiting for exclusive lock: $LOCKFILE"
          if ! flock -w 600 9; then
            echo "[$SERVICE_NAME] ERROR: Could not acquire deploy lock within 10 minutes." >&2
            exit 1
          fi
          echo "[$SERVICE_NAME] Lock acquired at $(date -Is)"

          trap 'echo "[$SERVICE_NAME] Releasing lock"; flock -u 9' EXIT

          cd "$REMOTE_DIR"
          git fetch --all --prune
          git checkout -f main || git switch -f main
          git reset --hard origin/main
          git clean -fd -e logs/

          echo "[$SERVICE_NAME] Rebuilding and bringing up service with health wait..."
          DOCKER_BUILDKIT=1 docker compose -p jassspace up -d \
            --build \
            --remove-orphans \
            --wait \
            --wait-timeout 180 \
            "$SERVICE_NAME"

          echo "[$SERVICE_NAME] Deploy verified by compose --wait"
          docker compose -p jassspace ps
          EOF

      - name: Show recent service logs
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SERVICE_NAME: nextjs
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" "$SERVICE_NAME" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          SERVICE_NAME="$2"
          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          if flock -s -w 120 9; then
            cd "$REMOTE_DIR"
            echo "--- Showing logs for $SERVICE_NAME ---"
            docker compose -p jassspace logs "$SERVICE_NAME" --since=5m || true
          else
            echo "[$SERVICE_NAME] Skipping logs: could not acquire shared lock within 2 minutes" >&2
          fi
          EOF
