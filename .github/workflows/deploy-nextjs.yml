name: Deploy NextJS Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'

jobs:
  deploy-nextjs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy nextjs service (locked & health-gated via compose)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SERVICE_NAME: nextjs
        run: |
          # Passing variables as arguments $1 and $2
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" "$SERVICE_NAME" <<'EOF'
          set -euo pipefail

          # Assigning arguments to local variables
          REMOTE_DIR="$1"
          SERVICE_NAME="$2"

          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          echo "[$SERVICE_NAME] Waiting for exclusive lock: $LOCKFILE"
          if ! flock -w 600 9; then
            echo "[$SERVICE_NAME] ERROR: Could not acquire deploy lock within 10 minutes." >&2
            exit 1
          fi
          echo "[$SERVICE_NAME] Lock acquired at $(date -Is)"

          trap 'echo "[$SERVICE_NAME] Releasing lock"; flock -u 9' EXIT

          cd "$REMOTE_DIR"
          git fetch --all --prune
          git checkout -f main || git switch -f main
          git reset --hard origin/main
          git clean -fd -e logs/
          git pull --ff-only

          echo "[$SERVICE_NAME] Rebuilding and bringing up service with health wait..."
          DOCKER_BUILDKIT=1 docker compose -p jassspace up -d \
            --build \
            --remove-orphans \
            --wait \
            --wait-timeout 180 \
            "$SERVICE_NAME"

          echo "[$SERVICE_NAME] Deploy verified by compose --wait ✅"
          EOF

      - name: Show recent service logs (shared lock)
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SERVICE_NAME: nextjs
        run: |
          # Passing variables as arguments $1 and $2
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" "$SERVICE_NAME" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          SERVICE_NAME="$2"

          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          if flock -s -w 120 9; then
            cd "$REMOTE_DIR"
            echo "--- Showing logs for $SERVICE_NAME ---"
            docker compose -p jassspace logs "$SERVICE_NAME" --since=5m || true
          else
            echo "[$SERVICE_NAME] Skipping logs: could not acquire shared lock within 2 minutes" >&2
          fi
          EOF