name: Deploy Dotnet Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'

jobs:
  deploy-dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy dotnet service (locked)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          # Pass REMOTE_DIR as an argument ($REMOTE_DIR) to bash -s
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" <<'EOF'
          set -euo pipefail
          
          # Capture the first argument as the variable inside the remote session
          REMOTE_DIR="$1"

          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          echo "[dotnet] Waiting for exclusive lock: $LOCKFILE"
          if ! flock -w 600 9; then
            echo "[dotnet] ERROR: Could not acquire deploy lock within 10 minutes." >&2
            exit 1
          fi
          echo "[dotnet] Lock acquired at $(date -Is)"

          trap 'echo "[dotnet] Releasing lock"; flock -u 9' EXIT

          cd "$REMOTE_DIR"
          git fetch --all --prune
          git checkout -f main || git switch -f main
          git reset --hard
          git clean -fd -e logs/
          git pull --ff-only

          echo "[dotnet] Rebuilding and bringing up service with health wait..."
          DOCKER_BUILDKIT=1 docker compose -p jassspace up -d \
            --build \
            --remove-orphans \
            --wait \
            --wait-timeout 180 \
            dotnet worker

          echo "[dotnet] Deploy verified by compose --wait ✅"
          docker compose -p jassspace ps
          EOF

      - name: Show recent service logs (shared lock)
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          # Pass REMOTE_DIR as an argument here too
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" <<'EOF'
          set -euo pipefail
          
          # Capture the argument
          REMOTE_DIR="$1"

          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          if flock -s -w 120 9; then
            cd "$REMOTE_DIR"
            docker compose -p jassspace logs dotnet worker --since=5m || true
          else
            echo "[dotnet] Skipping logs: could not acquire shared lock within 2 minutes" >&2
          fi
          EOF