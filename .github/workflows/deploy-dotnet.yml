name: Deploy Dotnet Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy-dotnet.yml"

permissions:
  contents: read

concurrency:
  group: jassspace-production-deploy
  cancel-in-progress: false

jobs:
  validate-dotnet:
    name: Validate Dotnet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore JassSpace.sln
        working-directory: api

      - name: Build
        run: dotnet build JassSpace.sln --no-restore --configuration Release
        working-directory: api

      - name: Test
        run: dotnet test JassSpace.sln --no-build --configuration Release
        working-directory: api

  deploy-dotnet:
    name: Deploy Dotnet
    needs: validate-dotnet
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${REMOTE_DIR:?Missing REMOTE_DIR secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          echo "Deployment secrets are present."

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dotnet service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          echo "[dotnet] Waiting for exclusive lock: $LOCKFILE"
          if ! flock -w 600 9; then
            echo "[dotnet] ERROR: Could not acquire deploy lock within 10 minutes." >&2
            exit 1
          fi
          echo "[dotnet] Lock acquired at $(date -Is)"

          trap 'echo "[dotnet] Releasing lock"; flock -u 9' EXIT

          cd "$REMOTE_DIR"
          git fetch --all --prune
          git checkout -f main || git switch -f main
          git reset --hard origin/main
          git clean -fd -e logs/

          echo "[dotnet] Rebuilding and bringing up service with health wait..."
          DOCKER_BUILDKIT=1 docker compose -p jassspace up -d \
            --build \
            --remove-orphans \
            --wait \
            --wait-timeout 180 \
            dotnet

          echo "[dotnet] Deploy verified by compose --wait"
          docker compose -p jassspace ps
          EOF

      - name: Show recent service logs
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          if flock -s -w 120 9; then
            cd "$REMOTE_DIR"
            docker compose -p jassspace logs dotnet --since=5m || true
          else
            echo "[dotnet] Skipping logs: could not acquire shared lock within 2 minutes" >&2
          fi
          EOF
