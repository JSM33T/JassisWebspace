name: Refresh containers (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-containers-production
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh containers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${REMOTE_DIR:?Missing REMOTE_DIR secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          echo "Deployment secrets are present."

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Refresh containers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s "$REMOTE_DIR" <<'EOF'
          set -euo pipefail

          REMOTE_DIR="$1"
          LOCKFILE="${REMOTE_DIR}/.deploy.lock"
          exec 9>"$LOCKFILE"

          echo "[refresh] Waiting for exclusive lock: $LOCKFILE"
          if ! flock -w 600 9; then
            echo "[refresh] ERROR: Could not acquire deploy lock within 10 minutes." >&2
            exit 1
          fi
          echo "[refresh] Lock acquired at $(date -Is)"

          trap 'echo "[refresh] Releasing lock"; flock -u 9' EXIT

          cd "$REMOTE_DIR"
          docker compose -p jassspace up -d --force-recreate --remove-orphans --wait --wait-timeout 180
          docker compose -p jassspace ps
          EOF

      - name: Show recent logs
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${REMOTE_DIR}' && docker compose -p jassspace logs --since=5m || true"
