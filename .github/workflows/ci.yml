name: Validate

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-dotnet:
    name: Validate .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore JassSpace.sln
        working-directory: api

      - name: Build
        run: dotnet build JassSpace.sln --no-restore --configuration Release
        working-directory: api

      - name: Test
        run: dotnet test JassSpace.sln --no-build --configuration Release
        working-directory: api

  validate-nextjs:
    name: Validate Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
